# build.yml -- the CI lane's entry (design D1/D2/D11). Based on PR #2 by
# huoyan1231 (thanks!) -- the vcpkg/CMake build steps he authored now live in
# build-core.yml, which this file dispatches; his authorship stays in this
# PR's history. Reworked per the maintainers' design: a THIN entry so the CI
# lane and the release lane share ONE build implementation (build-core@main,
# remote form on purpose -- a local-path uses: would resolve from the
# triggering branch).
#
# MANUAL ONLY, and deliberately: a ~20-minute Windows runner is the heaviest
# thing this project can ask for, and asking for it on
# every push spends it on commits that cannot reach the DLL. What the automatic
# lane was there to protect -- the source invariants -- is now checked by
# repo-gates.yml instead, which runs the same gate scripts on every push in
# about ten seconds and needs no compiler. Only the checks that genuinely
# require a built DLL wait for a dispatch: abi_gate.py (the D-3 slim contract,
# ZERO imported UE4SS symbols) and the package drill. The nightly cron stays
# dropped: a clock is not a reason to build.
# Artifacts are CI evidence, NOT distribution -- releases are the supported
# install channel.
name: build

on:
  workflow_dispatch:
    inputs:
      cacheless:
        description: build without caches (the release-path smoke)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: VOTV-MP/Multivoid/.github/workflows/build-core.yml@main
    with:
      ref: ${{ github.sha }}
      source-sha: ${{ github.sha }}
      use-cache: ${{ !inputs.cacheless }}

  # Publish the built zip to a rolling dev-latest release. This is the
  # distribution channel the in-game updater (F1 > Mod > Update) reads:
  # one tag, always the newest manual build, SHA in the notes for the
  # version check. Needs contents:write, which the build job must not have.
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the built tree (profile skeleton + assembly script)
        # Clean checkout FIRST: the default clean would wipe the artifact
        # downloaded below, so the artifact download comes after this step.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ./dist

      - name: Assemble the one-click profile zip
        # Fork-only distribution step. The build itself runs upstream's
        # build-core@main (design D11/R22), which knows nothing of the
        # profile; the profile is assembled here, in the fork's own
        # publish lane. The mod zip's layout IS the package.ps1 stage
        # tree, so unpacking it gives package-profile.ps1 its input, and
        # the publish step below attaches the profile zip via ./dist/*.zip.
        shell: pwsh
        run: |
          $modZip = @(Get-ChildItem ./dist/Pelmentor-Multivoid-*.zip | Where-Object { $_.Name -notlike '*profile*' })
          if ($modZip.Count -ne 1) { throw "expected exactly one mod zip in ./dist, found $($modZip.Count)" }
          $stage = Join-Path $env:RUNNER_TEMP 'profile-stage'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -Path $modZip[0].FullName -DestinationPath $stage -Force
          pwsh -File .github/ci/package-profile.ps1 -StageDir $stage -OutDir ./dist
          exit $LASTEXITCODE

      - name: Publish rolling dev-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="dev-latest"
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          gh release delete "$TAG" --cleanup-tag -y -R "$REPO" || true
          gh release create "$TAG" ./dist/*.zip \
            --title "dev-latest" \
            --prerelease \
            -R "$REPO" \
            --notes "sha: $SHA

          Rolling development build of the Multivoid fork.
          The in-game updater (F1 > Mod > Update) installs the mod zip.
          install-profile.ps1 installs Multivoid-r2modman-profile.zip,
          the complete mod-manager profile for friends."
